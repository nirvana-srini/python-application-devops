
name: Deploy Python to Private EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository on GitHub runner
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Copy application to private EC2 via bastion
      - name: Copy Python files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRIVATE_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}

          source: "src/app.py,requirements.txt"
          target: "/home/ec2-user/app"
          overwrite: true

      # 3. Install Python and run Flask
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRIVATE_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}

          command_timeout: 15m

          script: |
            set -e

            sudo dnf install -y python3 python3-pip

            cd /home/ec2-user/app

            python3 -m venv venv
            venv/bin/python -m pip install -r requirements.txt
            venv/bin/python -m pip install gunicorn

            sudo tee /etc/systemd/system/my-python-app.service >/dev/null <<'EOF'
            [Unit]
            Description=Flask Application
            After=network.target

            [Service]
            User=ec2-user
            WorkingDirectory=/home/ec2-user/app
            ExecStart=/home/ec2-user/app/venv/bin/gunicorn --chdir /home/ec2-user/app/src --bind 127.0.0.1:8080 app:app
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable --now my-python-app
            sudo systemctl restart my-python-app

            curl -fsS http://127.0.0.1:8080/health
