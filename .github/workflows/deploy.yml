name: Deploy and Install Python Dependencies on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            # Update package lists and install Python 3 and pip
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip

            # Navigate to the project directory (adjust the path as needed)
            cd /home/ec2-user/app

            #copy source code to the EC2 instance
            git pull origin main

            # Install Python dependencies from requirements.txt
            pip3 install -r requirements.txt

            # start the application (adjust the command as needed)
            nohup python3 app.py &